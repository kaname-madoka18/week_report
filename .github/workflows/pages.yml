name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore linked gallery media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .media-release
          gh release download gallery-media-20260923 --repo "$GITHUB_REPOSITORY" --pattern 'gallery-media-*.tar.gz' --dir .media-release
          for archive in .media-release/*.tar.gz; do
            tar -xzf "$archive" -C .
          done
      - name: Prepare static site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('.')
          dst = Path('_site')
          dst.mkdir()
          for item in src.iterdir():
              if item.name in {'.git', '.github', '_site', '.media-release', 'README.md'}:
                  continue
              out = dst / item.name
              if item.is_dir():
                  shutil.copytree(item, out, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, out)
          (dst / '.nojekyll').touch()
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
