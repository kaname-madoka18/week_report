name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore linked gallery media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .media-release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/gallery-media-20260923" --jq '.assets[] | [.id, .name] | @tsv' > .media-release/assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -o ".media-release/$asset_name" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < .media-release/assets.tsv
          for archive in .media-release/gallery-media-*.tar.gz; do
            tar -xzf "$archive" -C .
          done
      - name: Prepare static site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('.')
          dst = Path('_site')
          dst.mkdir()
          for item in src.iterdir():
              if item.name in {'.git', '.github', '_site', '.media-release', 'README.md'}:
                  continue
              out = dst / item.name
              if item.is_dir():
                  shutil.copytree(item, out, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, out)
          (dst / '.nojekyll').touch()
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
